<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homem-Aranha</title>
<style>
:root{--red:#e1202b;--blue:#1b3cff;--dark:#05060f;--ink:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--dark);color:var(--ink);font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 30%,#1a0a2e 0%,#05060f 70%)}
#web{position:fixed;inset:0;opacity:.18;background:
 repeating-conic-gradient(from 0deg at 50% 0%,transparent 0 9deg,#fff 9deg 9.3deg),
 repeating-radial-gradient(circle at 50% 0%,transparent 0 60px,#fff 60px 61.5px)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.scan{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:3;transition:opacity .4s}
.box{position:relative;width:190px;height:190px;border:3px solid var(--red);border-radius:18px;display:grid;place-items:center;box-shadow:0 0 30px var(--red),inset 0 0 30px #e1202b55}
.box svg{width:110px;fill:var(--red);opacity:.85}
.box i{position:absolute;left:6px;right:6px;height:4px;background:#fff;box-shadow:0 0 14px 4px var(--blue),0 0 30px 8px var(--blue);animation:sweep 1.1s ease-in-out infinite alternate}
@keyframes sweep{from{top:8px}to{top:176px}}
.scan p{letter-spacing:.35em;font-size:1.4rem;color:#fff;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
body.on .scan{opacity:0;pointer-events:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none}
body.on .flash{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px 7vh;z-index:2;visibility:hidden}
body.on .stage{visibility:visible}
.rig{--w:170px;position:absolute;top:0;left:50%;margin-left:calc(var(--w) / -2);width:var(--w);transform-origin:50% -2vh;transform:translateY(-110vh)}
body.on .rig{animation:drop 1.1s .25s cubic-bezier(.3,1.5,.5,1) forwards,swing 3.4s 1.4s ease-in-out infinite}
@keyframes drop{to{transform:translateY(12vh)}}
@keyframes swing{0%,100%{transform:translateY(12vh) rotate(-8deg)}50%{transform:translateY(12vh) rotate(8deg)}}
.thread{position:absolute;left:50%;bottom:100%;width:2px;height:130vh;background:linear-gradient(#fff9,#fff);box-shadow:0 0 6px #fff}
.rig img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 22px #e1202b99);transform:none}
h1{font-size:clamp(2.6rem,12vw,4.6rem);line-height:.9;text-align:center;letter-spacing:.04em;color:var(--red);text-shadow:3px 3px 0 var(--blue),0 0 30px #e1202b88;opacity:0;transform:scale(.6)}
body.on h1{animation:pop .6s 1.1s cubic-bezier(.3,1.6,.5,1) forwards,glitch 4s 3s infinite}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes glitch{0%,92%,100%{transform:none}94%{transform:translate(-4px,2px) skewX(6deg)}96%{transform:translate(4px,-2px) skewX(-6deg)}}
.sub{margin-top:10px;font-size:1.15rem;letter-spacing:.2em;text-align:center;color:#cfd6ff;opacity:0}
body.on .sub{animation:pop .6s 1.5s forwards}
button{margin-top:22px;font:inherit;font-size:1.4rem;letter-spacing:.15em;padding:14px 30px;border:0;border-radius:40px;background:linear-gradient(135deg,var(--red),#9c0d16);color:#fff;box-shadow:0 0 0 3px #fff3,0 8px 30px #e1202b88;opacity:0;cursor:pointer}
body.on button{animation:pop .6s 1.9s forwards,pulse 1.6s 2.6s infinite}
button:active{transform:scale(.94)}
@keyframes pulse{50%{box-shadow:0 0 0 10px #e1202b22,0 8px 40px #e1202bcc}}
.hint{margin-top:14px;font-size:.95rem;letter-spacing:.2em;color:#8b93c9;opacity:0}
body.on .hint{animation:pop .6s 2.3s forwards}
body.sense{animation:shake .35s}
@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-2px)}}
</style>
</head>
<body>
<div id="web"></div>
<div class="scan">
  <div class="box">
    <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 100 4 2 2 0 000-4zm0 5c-1.7 0-3 1.3-3 3l-5 3 1 1 4-1.5V20h6v-2.5l4 1.5 1-1-5-3c0-1.700-1.300-3-3-3zM4 4l5 4-1 1-5-3zm16 0l1 2-5 3-1-1z"/></svg>
    <i></i>
  </div>
  <p>ESCANEANDO...</p>
</div>
<div class="flash"></div>
<div class="stage">
  <div class="rig">
    <div class="thread"></div>
    <img src="homem-aranha.png" alt="Homem-Aranha" draggable="false">
  </div>
  <h1>HOMEM<br>ARANHA</h1>
  <div class="sub">SEU AMIGO E VIZINHO</div>
  <button id="go">LANÇAR TEIA</button>
  <div class="hint">TOQUE EM QUALQUER LUGAR DA TELA</div>
</div>
<canvas id="c"></canvas>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,shots=[];
function rs(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
setTimeout(function(){document.body.classList.add('on');try{navigator.vibrate&&navigator.vibrate([60,40,120])}catch(e){}},2400);
function shoot(px,py){
  shots.push({x:px,y:py,t:0});
  document.body.classList.remove('sense');void document.body.offsetWidth;document.body.classList.add('sense');
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
}
addEventListener('pointerdown',function(e){if(document.body.classList.contains('on'))shoot(e.clientX,e.clientY)});
document.getElementById('go').addEventListener('click',function(e){e.stopPropagation();shoot(Math.random()*W,Math.random()*H*.6+40)});
function drawWeb(px,py,r,a){
  x.strokeStyle='rgba(255,255,255,'+a+')';x.lineWidth=1.4;
  for(var i=0;i<8;i++){var an=i*Math.PI/4;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(an)*r,py+Math.sin(an)*r);x.stroke()}
  for(var k=1;k<=3;k++){x.beginPath();for(var j=0;j<=8;j++){var an2=j*Math.PI/4,rr=r*k/3*(j%2?.82:1);var qx=px+Math.cos(an2)*rr,qy=py+Math.sin(an2)*rr;j?x.lineTo(qx,qy):x.moveTo(qx,qy)}x.stroke()}
}
function loop(){
  x.clearRect(0,0,W,H);
  shots=shots.filter(function(s){return s.t<110});
  shots.forEach(function(s){
    s.t++;var p=Math.min(s.t/10,1),sx=W/2,sy=H,ex=sx+(s.x-sx)*p,ey=sy+(s.y-sy)*p,a=s.t<40?1:Math.max(0,1-(s.t-40)/70);
    x.strokeStyle='rgba(255,255,255,'+a+')';x.lineWidth=2;x.shadowColor='#fff';x.shadowBlur=8;
    x.beginPath();x.moveTo(sx,sy);x.lineTo(ex,ey);x.stroke();x.shadowBlur=0;
    if(p>=1)drawWeb(s.x,s.y,Math.min(70,(s.t-10)*8),a);
  });
  requestAnimationFrame(loop)
}
loop();
})();
</script>
</body>
</html>
